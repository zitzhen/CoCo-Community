name: Dependency Review

# PR 修改依赖清单（package-lock.json）时，检查是否引入已知漏洞依赖
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
